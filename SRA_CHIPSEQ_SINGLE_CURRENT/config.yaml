# Reference genome (gzipped FASTA, downloaded on the login node)
genomeFTP: https://ftp.ensembl.org/pub/release-115/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.toplevel.fa.gz

# Fragment length (bp). Single-end reads are extended to this length in their
# 5'->3' direction for the coverage tracks, and MACS2 uses it as --extsize
# (--nomodel). Use the library's mean fragment size (e.g. 150-300 for sonicated
# chromatin). 0 = do not extend (coverage of the sequenced read length only,
# MACS2 falls back to 200).
fragment_length: 200

# MACS2 p-value cutoff (-p)
macs2_pvalue: 0.01

# Set to true for broad histone marks (H3K27me3, H3K9me3, ...)
macs2_broad: false

# --- optional -----------------------------------------------------------
# Reuse an existing bowtie2 index (prefix, i.e. path without ".1.bt2").
# Requires genome_size as well.
# bowtie_index: /path/to/index/genome
# Effective genome size for MACS2 (number of non-N bases). If unset, it is
# counted from the downloaded FASTA.
# genome_size: 2913022398
# Test mode: only dump the first N spots of every SRA run (0 = all reads)
max_spots: 0
