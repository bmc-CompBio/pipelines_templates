name: sra_kallisto_single
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake-minimal=9.19.0
  - snakemake-executor-plugin-cluster-generic
  - pandas
  - sra-tools=2.11.0   # >=3.0 needs glibc 2.25, cluster (CentOS 7) has 2.17
  - kallisto=0.48.0   # >=0.50 needs a newer HDF5 than sra-tools=2.11.0 allows
  - salmon
  - multiqc
  - r-base
  - r-yaml
  - bioconductor-tximport
  - bioconductor-summarizedexperiment
  - bioconductor-genomicfeatures
