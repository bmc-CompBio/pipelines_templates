name: sra_chipseq_paired
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - snakemake-minimal=9.19.0
  - snakemake-executor-plugin-cluster-generic
  - pandas
  - sra-tools=2.11.0   # >=3.0 needs glibc 2.25, cluster (CentOS 7) has 2.17
  - samtools>=1.15   # >=1.17 conflicts with sra-tools=2.11.0
  - bowtie2>=2.5
  - macs2
  - multiqc
  - bioconductor-rtracklayer
