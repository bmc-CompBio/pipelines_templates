runtable: SraRunTable.csv

# Ensembl annotation (GTF for tx2gene, cDNA FASTA for the kallisto index)
gtfFTP: https://ftp.ensembl.org/pub/release-115/gtf/homo_sapiens/Homo_sapiens.GRCh38.115.gtf.gz
transcriptsFTP: https://ftp.ensembl.org/pub/release-115/fasta/homo_sapiens/cdna/Homo_sapiens.GRCh38.cdna.all.fa.gz
annotationVersion: 115

# human, mouse, rat, drosophila, zebrafish (used for the biomaRt gene annotation
# in se.rds; for other species set biomart_dataset below)
organism: human

# Library strandedness for kallisto:
#   auto       - detect with salmon on a 100k-read subset of the first run
#   none       - unstranded
#   forward    - read 1 is the sense strand (--fr-stranded)
#   reverse    - read 1 is antisense, e.g. dUTP/TruSeq stranded (--rf-stranded)
strandedness: auto

# kallisto bootstrap samples
bootstraps: 30

# --- optional -----------------------------------------------------------
# Gene symbol and biotype are read from the GTF. Entrez id and description are
# added from biomaRt if it is reachable (NA otherwise).
# biomart: false                           # skip biomaRt completely
# biomart_dataset: hsapiens_gene_ensembl   # overrides the organism lookup
# biomart_host: https://useast.ensembl.org # www.ensembl.org redirects BioMart requests
# Test mode: only dump the first N spots of every SRA run (0 = all reads)
max_spots: 0
